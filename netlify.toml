# Netlify configuration for ibrahimig.com
#
# Known live-site issues (as of 2026-10-11):
# 1. X-Robots-Tag: noindex, nofollow — site is blocked from search engines.
#    Fix: remove the noindex header in Netlify dashboard > Site settings >
#    Edge deploy > Headers.
# 2. /api/* returns 502 — the Express API server is not reachable from
#    Netlify. Deploy the backend separately and uncomment the redirect below.

[build]
  publish = "artifacts/portfolio/dist/public"
  command = "corepack enable && corepack pnpm install --no-frozen-lockfile && corepack pnpm --filter @workspace/portfolio run build"

[build.environment]
  NODE_VERSION = "22"

# Cache hashed assets aggressively (safe — only applies to /assets/*).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self)"

# SPA fallback — required for client-side routes (/en, /products, /blog, /admin)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# --- API proxy (uncomment and set the real host when the backend is up) ---
# [[redirects]]
#   from = "/api/*"
#   to = "https://YOUR_API_HOST/api/:splat"
#   status = 200
#   force = true
